[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "http-semantics-mcp"
version = "0.1.0"
description = "Deterministic HTTP semantics judgement MCP server (CORS, cache freshness, conditional requests, Vary)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["mcp", "http", "cors", "cache", "rfc9111", "rfc9110", "fetch-standard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "PyYAML>=5.3",
]

[project.scripts]
http-semantics-mcp = "http_semantics_mcp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
http_semantics_mcp = ["references/*.json", "schemas/tools/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
