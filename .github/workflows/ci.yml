name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "test (${{ matrix.os }}, py${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: "Install (runtime + dev extras)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: "Version and self-test"
        run: |
          python -m http_semantics_mcp --version
          python -m http_semantics_mcp --selftest

      - name: "Console script smoke"
        run: |
          http-semantics-mcp --version
          http-semantics-mcp --selftest

      - name: "Repository gates"
        run: python tools/run_gates.py

      - name: "Generated data is reproducible"
        run: |
          python tools/gen_codes.py --check
          python tools/gen_golden.py --check
          python tools/golden_coverage.py

      - name: "Mutation verification"
        run: python tools/mutate_check.py

      - name: "stdio handshake smoke"
        run: python tools/smoke_stdio.py

      - name: "Full test suite"
        run: python -m pytest -q
